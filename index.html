<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pomodoro+</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <span class="logo">Pomodoro<span class="logo-plus">+</span></span>
    </header>

    <div class="mode-tabs">
      <button class="tab active" data-mode="focus">Focus</button>
      <button class="tab" data-mode="short">Short break</button>
      <button class="tab" data-mode="long">Long break</button>
    </div>

    <div class="clock-section">
      <svg class="ring-svg" viewBox="0 0 220 220" aria-hidden="true">
        <circle class="ring-bg" cx="110" cy="110" r="96"/>
        <circle class="ring-fill" id="ring" cx="110" cy="110" r="96"/>
      </svg>
      <div class="clock-inner">
        <div class="time-display" id="timeDisplay">25:00</div>
        <div class="phase-label" id="phaseLabel">Focus session</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-icon" id="resetBtn" title="Reset" aria-label="Reset timer">&#8635;</button>
      <button class="btn-main" id="startBtn">Start</button>
      <button class="btn-icon" id="skipBtn" title="Skip" aria-label="Skip session">&#8677;</button>
    </div>

    <div class="divider"></div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-val" id="statPomos">0</div>
        <div class="stat-label">Pomodoros</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="statFocus">0m</div>
        <div class="stat-label">Focus time</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="statStreak">0</div>
        <div class="stat-label">Streak</div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="task-section">
      <div class="section-label">Tasks</div>
      <div class="task-input-row">
        <input type="text" id="taskInput" placeholder="Add a task..." />
        <button class="btn-icon" id="addTaskBtn">+</button>
      </div>
      <div class="task-list" id="taskList"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
